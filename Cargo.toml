[package]
name = "slack-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/matpb/slack-mcp-rs"
homepage = "https://github.com/matpb/slack-mcp-rs"
description = "MCP server for Slack that acts as the installing user (user token): search, read, post, upload and download, over stdio or streamable HTTP"
keywords = ["mcp", "mcp-server", "slack", "ai", "llm"]
categories = ["command-line-utilities", "web-programming", "api-bindings"]
exclude = ["/scripts"]

[[bin]]
name = "slack-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
url = "2"

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
